<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeismoSense | GIS Intelligence Hud</title>
    <!-- GIS Engine: Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Industrial Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Iconography -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="industrial-theme">
    <div class="app-container">
        <!-- Dashboard Sidebar: Intelligence HUD -->
        <aside class="intelligence-hud glass">
            <header class="hud-header">
                <div class="brand">
                    <span class="binary-decor">// </span>
                    <h1>SEISMOSENSE</h1>
                    <span class="version-tag">V4.2</span>
                </div>
                <div class="system-heartbeat">
                    <span class="pinger"></span> SYSTEM ACTIVE
                </div>
            </header>

            <nav class="hud-tabs">
                <button class="tab-btn active" data-tab="surveillance">SURVEILLANCE</button>
                <button class="tab-btn" data-tab="analysis">PREDICTION</button>
            </nav>

            <div class="sidebar-content">
                <!-- Tab 1: Surveillance -->
                <div id="tab-surveillance" class="tab-pane active">
                    <section class="stat-grid">
                        <div class="stat-box">
                            <label>OPERATIONAL DATASET</label>
                            <span id="stat-count" class="value">0000</span>
                        </div>
                        <div class="stat-box">
                            <label>SEISMIC ACTIVITY</label>
                            <span class="value stable">STABLE</span>
                        </div>
                    </section>

                    <section class="log-panel">
                        <h3><i class="fa-solid fa-terminal"></i> ACTIVITY LOG</h3>
                        <div id="activity-log" class="log-entries">
                            <div class="log-entry">Initializing GIS Engine...</div>
                            <div class="log-entry">Loading Tectonic Plate Data...</div>
                        </div>
                    </section>
                </div>

                <!-- Tab 2: Prediction -->
                <div id="tab-analysis" class="tab-pane">
                    <section class="ingress-form">
                        <h3><i class="fa-solid fa-crosshairs"></i> COORDINATE ACQUISITION</h3>
                        <div class="input-row">
                            <div class="field">
                                <label>LATITUDE</label>
                                <input type="number" id="lat" placeholder="0.0000" step="0.0001">
                            </div>
                            <div class="field">
                                <label>LONGITUDE</label>
                                <input type="number" id="lng" placeholder="0.0000" step="0.0001">
                            </div>
                        </div>
                        <div class="field">
                            <label>CRUSTAL DEPTH (KM)</label>
                            <input type="number" id="depth" placeholder="10.0" step="0.1">
                        </div>
                        <button id="run-scan" class="action-btn">INITIATE RISK SCAN</button>
                    </section>

                    <section id="scan-results" class="results-report hidden">
                        <div class="report-header">
                            <h3><i class="fa-solid fa-file-shield"></i> INTEL REPORT</h3>
                            <span id="res-time">--:--:--</span>
                        </div>
                        <div class="report-body">
                            <div class="prediction-main">
                                <span class="label">MAGNITUDE PROBABILITY</span>
                                <h2 id="res-class" class="class-tag">ANALYSING...</h2>
                                <span id="res-conf" class="sub-value">--%</span>
                            </div>
                            <div class="risk-meter-complex">
                                <label>SEISMORISK INDEX</label>
                                <div class="meter-labels">
                                    <span id="res-risk-val">0.0</span>
                                    <span id="res-threat" class="threat-badge">--</span>
                                </div>
                                <div class="custom-progress">
                                    <div id="risk-fill" class="fill"></div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>

            <footer class="hud-footer">
                <p>USGS DATASET // ML CORE V4.2 // SECURE CONNECTION</p>
            </footer>
        </aside>

        <!-- Main Workspace: Geospatial Map -->
        <main class="map-workspace">
            <div id="map"></div>
            
            <!-- Map HUD Overlays -->
            <div class="map-overlay-top-left glass">
                <div class="coord-viewer">
                    <span id="cursor-lat">0.0000</span>, <span id="cursor-lng">0.0000</span>
                </div>
            </div>

            <div class="map-overlay-bottom-right glass-controls">
                <button id="toggle-history" class="map-btn active"><i class="fa-solid fa-circle-dot"></i> HISTORY</button>
                <button id="toggle-plates" class="map-btn"><i class="fa-solid fa-vector-square"></i> PLATES</button>
                <button id="toggle-heatmap" class="map-btn"><i class="fa-solid fa-fire"></i> RISKMAP</button>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="/static/dashboard.js"></script>
</body>
</html>
